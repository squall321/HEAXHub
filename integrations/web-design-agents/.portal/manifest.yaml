schema_version: 2
id: web_design_agents
# ⚠ 이름에 '심의' 를 넣지 마라. 이 라벨은 게이트웨이가 이 앱 16개 도구 설명 앞에 그대로 붙이고
#   search_tools 도 라벨을 매칭한다 — '심의' 가 들어 있으면 사용자가 공학 심의(deliberate_*)를
#   찾을 때마다 발표자료 회의체(meeting_*)로 수렴한다(실사고: 시뮬 심의 요청이 슬라이드 제작으로).
name: "WebDesignAgents — 발표자료·슬라이드 자동 생성"
version: 0.1.0
owner: "squall321"
status: stable                   # 운영 중(사내 공개). 허브의 '공개 앱' 판정이
                                 # company + stable 이라, 실제로 쓰고 있는데 draft 로
                                 # 두면 로그인 없이는 못 연다.
                                 # 익명 열람은 2026-11-01 에 닫았다 — 아래 launch.portal_auth.
app_type: web_app
execution_target: linux_runner

description: |
  ReportArchive 보고서 JSON 을 붙여넣으면 웹디자인 페르소나 14인 회의체가
  시나리오를 심의·집필하고, 씬 템플릿 라이브러리로 90초급 모션 영상(mp4)과
  PPT(16:9)를 자동 생성한다. 웹 콘솔에서 파이프라인 실행·브라우저 프리뷰·
  품질 게이트(QA 7종)·회의록 열람·모듈 갤러리를 제공한다.

  내레이션은 VoiceRecorder(voice_recorder) API 를 소비하고, 무인 심의는
  GLM-5-2 vLLM(HWAXPortal env-kits 상속)으로 오프로드한다.

tags:
  - presentation
  - video
  - deliberation
  - multi-agent

build:
  # fastapi_react 가 아니다 — 이 레포의 frontend/ 에는 package.json 이 없고 사전빌드된 dist/ 만
  # 있다. fastapi_react 스택은 pnpm 으로 프론트를 빌드하려 해서 SIF 빌드가 항상 실패했다
  # (실측: "ERR_PNPM_NO_PKG_MANIFEST No package.json found in /app/frontend"). 빌드가 없으니
  # 런처가 범용 폴백 ./.portal/run.sh 를 실행했고 그 파일도 없어 exit 127 로 45초마다 재시도만
  # 반복했다 — '열기'를 눌러도 제자리인 이유. 파이썬 서비스로 고정한다.
  stack: fastapi
  # 런타임 의존성이 전부 optional-dependencies 에만 있다 — 선언 안 하면 `pip install -e .` 로
  # 안 깔린다. web(uvicorn/fastapi) 없으면 "uvicorn: executable file not found", render(playwright/
  # pptx/pillow) 없으면 렌더가 죽고, mcp/llm 은 심의·MCP 노출에 필요하다.
  extras:
    - web
    - render
    - mcp
    - llm

launch:
  mode: service
  # 로그인한 사람만 연다(사용자 결정 2026-11-01). company + stable 앱은 이 줄이 없으면 허브 게이트(authz)가 토큰 없이
  # 통과시켜 run 목록 · 산출물 내려받기 · 웹 콘솔 · /mcp 가 익명으로 열렸다(11-01 dev 실측 200). 켜면 익명은 401 이다.
  # 포털 사용자는 포털이 미리 심는 허브 세션 쿠키로, 게이트웨이는 허브 서비스 PAT 로 지나간다. 서비스 앱이라 라우트 · 재기동과는
  # 상관없고 스캐너가 App.extra 에 옮기면(5분 주기) 게이트만 바뀐다. 앱 커밋이 그대로인 동안 허브는 SIF 열쇠를 다시 재지 않는다.
  portal_auth: true
  # 게이트를 지난 뒤 이 앱으로 가는 요청에서 Authorization 을 지운다(사용자 결정 2026-11-01 — WDA 에는 넘기지 않게).
  # 포털의 '발표자료로' 는 그 사람 이름의 포털 PAT 로 부르는데, 그 토큰은 그 사람이 볼 수 있는 허브 앱 전부에 통한다.
  # WDA 는 웹 · /mcp 어디서도 그 헤더를 읽지 않고, 사람은 검증된 X-Heax-User-* 로 안다. 다음 reconcile(45초)이 라우트를 다시 건다.
  forward_authorization: false
  # 스택 기본 진입점은 app.main:app 이지만 이 패키지는 src/wdweb/app.py 의 `app` 이다.
  # StaticFiles 로 frontend/dist 를 직접 서빙하고 ROOT_PATH 도 스스로 반영한다.
  command: uvicorn wdweb.app:app --host 127.0.0.1 --port $PORT --root-path $ROOT_PATH
  env:
    # HEAXHub 영구 볼륨(/data) — 회의록·파이프라인·렌더 산출물 전부 여기에
    WDA_DATA_DIR: /data
    # 형제 서비스 — 포탈 경유가 정석이나 서비스 계정 PAT 확정 전까지 로컬 직결
    WDA_TTS_BASE_URL: http://127.0.0.1:8177
    # 렌더 훅(scripts/heaxhub-build.sh)이 chromium 을 /opt/ms-playwright 에 구워 뒀다.
    # 런타임도 같은 경로를 보게 하고, 다운로드 시도를 원천 차단해 폐쇄망에서 재현시킨다.
    PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  # health_check·restart_policy 는 반드시 launch: 아래 — 런처와 서비스매니저는
  # launch.health_check / launch.restart_policy 만 읽으므로 top-level 선언은 조용히
  # 무시되고, 스택 기본값 /health 로 프로브돼 404 만 쌓인다(재시작 정책도 미적용).
  # 재시도 횟수 키는 max_attempts 다 — max_retries 는 읽히지 않는다.
  health_check:
    path: /api/health
  restart_policy:
    policy: on_failure
    max_attempts: 3

source:
  type: git
  url: https://github.com/squall321/WebDesignAgents.git
  ref: main

permissions:
  visibility: company

mcp:
  expose: true
  path: /mcp
  transport: streamable_http

resources:
  cpu: 4
  memory_gb: 8
  # 렌더는 헤드리스 chromium(CPU) — GPU 불필요
  gpu: false
