schema_version: 2
id: paper_ingest
name: Paper Ingest
version: 0.1.0
owner: cae-automation
status: beta                     # GitHub 푸시 완료(squall321/PaperIngest, private) — 정식 등록
app_type: web_app
execution_target: linux_runner
description: |
  연구 논문/특허를 중앙 코퍼스로 수집하고, 상암 GLM(OpenAI 호환)으로 검증 게이트를 수행하는 서버.
  - 유입: Drive-relay(rclone) 주채널 + REST 업로드(/api/v1/papers) 보조
  - 처리: 임베딩 NN 분류 → 증분 색인 → 그라운딩 → GLM 게이트 → 카드 fact_refs 적용
  - 웹 UI: /apps/paper_ingest/ (PDF 논문 업로드 → 인입 → GLM 게이트 결과·카드 반영 확인)
  - 헬스: /health, MCP: /apps/paper_ingest/mcp (streamable HTTP)
tags: [ingest, corpus, papers, patents, mcp, cae, web]
build:
  type: python_venv
  stack: fastapi
  python_version: "3.12"
launch:
  mode: service
  base_path_aware: true          # 브라우저 UI 를 /apps/paper_ingest/ 로 프록시(Caddy) — 앱은 ROOT_PATH 로 대응
  env:
    # GLM 게이트는 HEAX 가 주입하는 LLM_*(RA 상속=cae00 상암 GLM)를 config 가 폴백으로 읽는다.
    # NO_PROXY 는 config 가 base URL 호스트에서 자동 도출한다 — 내부 IP·비밀(GLM_API_KEY)은 여기 두지 않는다.
    INBOX_DIR: /data/_inbox        # 업로드 스테이징(app_data 바인드, 영속)
    CORPUS_DIR: /data/corpus       # 로컬 코퍼스 스테이징(cae00 은 색인 안 함 — 색인·그라운딩은 dev)
  health_check: { type: http, path: /health }
  restart_policy: { policy: on_failure, max_attempts: 3 }
permissions:
  visibility: team
resources:
  cpu: 2
  memory_gb: 8            # BGE-M3+reranker 색인/그라운딩용(게이트는 원격 GLM)
  gpu: true               # 로컬 색인/리랭킹에 GPU 사용(게이트 GLM 은 원격 상암)
source:
  type: git
  url: https://github.com/squall321/PaperIngest.git
  ref: main
mcp:
  expose: true
  path: /mcp
  transport: streamable_http
