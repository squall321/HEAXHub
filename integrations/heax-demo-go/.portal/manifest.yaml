schema_version: 2
id: heax_demo_go
name: Demo · Hello (Go)
version: 2.4.0
owner: heaxhub-demo
status: stable
app_type: web_app
execution_target: linux_runner
description: HEAXHub go_service stack demo. Stdlib-only Go HTTP service with health
  probe and in-memory counter.
build:
  stack: go_service
launch:
  mode: service
  # SIF 안 바이너리는 /app/bin/server 다 — 빌드 산출물 이름이 매니페스트와 달랐다.
  # ./heax-demo-go 를 부르던 탓에 2026-07-27 부터 매 기동이
  # "FATAL: stat /app/heax-demo-go: no such file or directory" 로 죽었다.
  command: ./bin/server
  health_check:
    path: /health
restart_policy:
  policy: on_failure
  max_retries: 3
source:
  type: git
  url: var/local-demo-repos/heax-demo-go.git
  ref: main
permissions:
  visibility: company
