schema_version: 2
id: web_design_agents
name: "WebDesignAgents — 전문가 심의 발표자료 생성"
version: 0.1.0
owner: "squall321"
status: draft
app_type: web_app
execution_target: linux_runner

description: |
  보고서를 붙여넣으면 웹디자인·발표 전문 페르소나 14인이 심의해 시나리오를 정하고,
  소개영상(mp4)·발표자료(PPTX)를 자동 생성한다. 심의 엔진(wdcore)은 순서·인용 검증·
  회의록만 강제하고 LLM 호출은 어댑터(MCP=Claude 연기 / vLLM=GLM-5-2 무인)에만 둔다.
  렌더는 Playwright chromium 헤드리스 + ffmpeg, TTS 는 VoiceRecorder API 를 소비한다.

  무거운 앱(chromium ~646MB·python3.13 venv)이라 heax-hub SIF 표준 빌드가 아니라
  자체 venv 독립 서비스로 돈다 (HWAXPortal services.yaml: web-design-agents).
  폐쇄망은 scripts/{browser,data}-from-drive.sh 로 chromium·데이터를 선복원한다.

tags:
  - deliberation
  - presentation
  - video
  - pptx

build:
  stack: fastapi_react

launch:
  mode: service
  env:
    # HEAXHub 가 bind 하는 영구 볼륨. 운영 데이터(회의·렌더·QA)는 여기에 남는다.
    WDA_DATA_DIR: /data
    # Playwright chromium 은 Drive 선복원분을 쓴다 (런타임 네트워크 불필요).
    PLAYWRIGHT_BROWSERS_PATH: /data/ms-playwright
  # ⚠ health_check·restart_policy 는 반드시 launch: 아래에 둔다. 런처와 서비스매니저는
  # launch.health_check / launch.restart_policy 만 읽으므로 top-level 선언은 조용히
  # 무시되고, 스택 기본값 /health 로 프로브돼 404 로그만 쌓인다(재시작 정책도 미적용).
  # 재시도 횟수 키는 max_attempts 다 — max_retries 는 읽히지 않는다.
  health_check:
    path: /api/health
  restart_policy:
    policy: on_failure
    max_attempts: 3

# HWAX MCP Gateway 자동탐지 opt-in — wdmcp 심의 툴 11종을 연합에 노출한다.
mcp:
  expose: true
  path: /mcp
  transport: streamable_http

source:
  type: git
  url: https://github.com/squall321/WebDesignAgents.git
  ref: main

permissions:
  visibility: company

resources:
  cpu: 4
  memory_gb: 8
  gpu: false
