schema_version: 2
id: kooremapper
name: "DynaForge"
version: "1.8.0"
owner: "koo.park"
status: stable
app_type: external_link
execution_target: external_url
description: "DynaForge — LS-DYNA K파일 전처리 자동화 플랫폼. 47개 op(재료DB 치환·메시 변환/재메시·조립/눌림/굽힘 초기응력(squeeze/cclip/prestress/warpage)·해석 세팅·모델 메타/연결도)를 웹 UI/REST API/MCP로 제공."
build:
  stack: external_proxy
launch:
  mode: proxy
  upstream: http://127.0.0.1:8700     # API가 SPA(dist)도 서빙 — self-signed :8443 대신 http
  strip_prefix: true
  portal_auth: true                    # 포탈 forward_auth + X-Heax-* identity 전파 → 앱 SSO 자동 로그인
permissions:
  visibility: company     # company | department | team | private
# MCP 는 별도 엔트리(kooremapper-mcp)로 노출한다 — MCP 는 자체 kr_ PAT 인증을
# 쓰므로 웹의 portal_auth forward_auth 게이트와 분리해야 충돌하지 않는다.
