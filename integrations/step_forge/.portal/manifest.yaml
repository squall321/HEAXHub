schema_version: 2
id: step_forge            # /apps/step_forge · state · 인스턴스명의 원천
name: StepForge
version: 0.1.0
owner: cae-automation
status: beta              # draft 는 MCP 레지스트리에서 제외된다
app_type: web_app
execution_target: linux_runner
description: |
  STEP(CAD) 포지 — 어셈블리 하이라키 인식, 파트 간 관계(tied/닿음/간극/침투) 추출,
  파트별 솔리드·중립면 메시, LS-DYNA K파일·접촉 YAML 내보내기, 3D 뷰어, 분석·수정 MCP.
  헬스 /health, MCP /apps/step_forge/mcp.
tags: [step, cad, mesh, assembly, mcp, cae, lsdyna]
build:
  type: python_venv
  stack: fastapi
  python_version: "3.12"   # 빌더는 이 값을 읽지 않는다 — SIF 템플릿이 3.12 고정(D-027)
launch:
  mode: service
  health_check: { type: http, path: /health }
  restart_policy: { policy: on_failure, max_attempts: 3 }
  env: { STEPFORGE_DATA_DIR: /data }
  # 포탈 신원(X-Heax-User-*)을 앱으로 넘긴다 — 과제 담당자 자동 기입(D-169).
  # 헤더가 없으면 앱은 담당자를 비운다(지어내지 않는다).
  portal_auth: true
permissions:
  # 2026-09-01 team → company. team 은 '앱 소유자와 organization 이 같은 사용자' 만 통과시키는데
  # (permission_service.can_view_app), 사내 사용자 상당수가 organization 이 비어 있어 StepForge REST
  # (/apps/step_forge/api/...)가 403 이었다. 리스크 심사 앱이 사용자 자격으로 tree.json 을 읽어야
  # 단위계·노드 id 를 얻고 게이트 G6 가 풀린다. 읽기 전용 조회 앱이라 사내 공개가 적정하다.
  visibility: company
resources:
  cpu: 2
  memory_gb: 16           # 693MB 파싱 피크 RSS 5.13GB 실측 × 여유 — 검출 8워커 상한의 근거
  gpu: false
# 빌드 소스는 GitHub — 다른 배포 앱들(hwax-risk·materialtwin-web·thermal-shock-mcp 등)과
# 같은 모양이다. HEAXHub 최신화(재스캔/재빌드) 시 main 브랜치 최신 커밋을 받아온다.
# ⚠ **로컬 커밋만으로는 반영되지 않는다 — push 가 배포 경로다.** 예전 `../StepForge`
# (리포 루트 기준 상대경로 → file://)는 **개발 박스에서만** 유효했다: 배포서버는 레포를
# ~/Projects 아래 두므로 형제 clone 이 없으면 fetch 가 실패하고, 스캐너는 prebuilt SIF 를
# 보기 **전에** fetch 하므로 앱이 FAILED 로 떨어진다(SIF 를 실어 보내도 못 구한다).
# ⚠ 깨끗한 clone 이라 .venv·var 는 딸려 들어가지 않는다(D-094).
source:
  type: git
  url: https://github.com/squall321/StepForge.git
  ref: main
mcp:
  expose: true
  path: /mcp
  transport: streamable_http
  description: STEP 어셈블리 점검·관계 검출·메시·K파일 내보내기 도구
