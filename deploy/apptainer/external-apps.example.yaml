# 운영서버 외부 연계 서비스 레지스트리 — 예시 템플릿.
# 이 파일을 var/external-apps.yaml 로 복사해서 채우세요(var/ 는 gitignore 라 update-all 이 보존).
#
#   cp deploy/apptainer/external-apps.example.yaml var/external-apps.yaml
#   # 편집 후:
#   bash deploy/apptainer/register-external.sh
#
# 각 항목은 "이미 IP:port 로 떠있는(venv 등) 외부 서비스"를 컨테이너/빌드 없이 /apps/ext_<id>/ 로
# reverse_proxy 연동한다. 최종 앱 id 에는 ext_ 접두가 자동으로 붙어 내 관리 앱과 충돌하지 않는다.

services:
  # 필수: id(소문자/숫자/_) + upstream(http://ip:port). 나머지는 선택.
  - id: teamb_dashboard              # → 앱 ext_teamb_dashboard, URL /apps/ext_teamb_dashboard/
    name: "B팀 대시보드"
    upstream: http://10.12.34.56:8200 # 그쪽 백엔드+프론트가 떠있는 IP:port (loopback 도 가능)
    strip_prefix: true                # 기본 true. upstream 이 루트("/")로 서빙하면 true 유지.
    visibility: company               # company | department | team | private (기본 company)
    status: stable                    # stable | beta (MCP 노출은 stable/beta 에서만)

  - id: teamc_api                     # MCP 도 노출하는 예 — upstream 이 /mcp 를 서빙할 때만 의미 있음
    name: "C팀 해석 API"
    upstream: http://127.0.0.1:8300
    visibility: department
    mcp:
      expose: true                    # HEAX /api/v1/mcp/servers 레지스트리 노출 → HWAX 게이트웨이 자동흡수
      path: /mcp                      # upstream 기준 MCP 경로(기본 /mcp)
      transport: streamable_http
